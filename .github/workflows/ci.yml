name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check iOS selector parity
        # RCT_EXTERN_METHOD registers a selector without checking that Swift
        # implements it, so a mismatch compiles cleanly and crashes at call
        # time. Neither the compiler nor the type checker sees it.
        run: yarn check:ios-parity

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-android:
    runs-on: ubuntu-latest
    env:
      TURBO_CACHE_DIR: .turbo/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for Android
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    # macos-latest tracks whatever image GitHub ships. That is what broke this
    # job: the image dropped Xcode 16.2 and the exact pin below could no longer
    # be satisfied. XCODE_VERSION is now a range for the same reason — pinning
    # one more exact version would just queue up the same failure.
    runs-on: macos-latest
    env:
      # Any Xcode 26.x. The major is pinned on purpose: example/ios/Podfile
      # carries a workaround for fmt 11.0.2, which does not build under the
      # clang that ships with Xcode 26, and that workaround has only been
      # exercised on this major.
      #
      # If a future 26.x breaks the build, pin an exact version here and say
      # which one worked — do not widen the range.
      XCODE_VERSION: ^26.4
      TURBO_CACHE_DIR: .turbo/ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache turborepo for iOS
        uses: actions/cache@v4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install cocoapods
        # The `steps.cocoapods-cache.outputs.cache-hit` condition that used to be
        # here referenced a step that does not exist in this workflow, so it
        # always evaluated empty and never gated anything.
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          # No `pod repo update`. Only SocketRocket resolves through the trunk
          # index, and the CDN-backed trunk resolves it on demand. The bulk
          # parallel index fetch that `repo update` performs is what fails with
          # "Error in the HTTP2 framing layer" and leaves empty spec directories
          # behind — the reason example/ios/Podfile declares VietmapTrackingSDK
          # by direct podspec URL in the first place.
          bundle exec pod install --project-directory=ios

      - name: Check the codegen path baked into Pods.xcodeproj
        if: env.turbo_cache_hit != 1
        # React Native writes the path to react-native into the codegen script
        # phase relative to the directory pod install ran from. Get it wrong and
        # the next clean build dies with "with-environment.sh: No such file or
        # directory" — and a warm DerivedData hides it, so this reads the
        # project file rather than trusting a build.
        run: yarn check:pods-path

      - name: Build example for iOS
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"
